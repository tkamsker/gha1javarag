[pytest]
# Pytest configuration for Java Codebase Indexer Pipeline

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.4

# Output options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Coverage options
    --cov=src/codeindex
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Custom markers
markers =
    slow: marks tests as slow (end-to-end pipeline tests, deselected by default)
    integration: marks tests requiring external services (Weaviate, Ollama)
    unit: marks tests as unit tests (fast, no external dependencies)
    e2e: marks tests as end-to-end tests (full pipeline execution)

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options
[coverage:run]
source = src/codeindex
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
    */conftest.py

[coverage:report]
# Fail if coverage is below 80%
fail_under = 80
# Show missing lines
show_missing = true
# Skip covered files
skip_covered = false
# Sort by coverage percentage
sort = Cover

[coverage:html]
directory = htmlcov
